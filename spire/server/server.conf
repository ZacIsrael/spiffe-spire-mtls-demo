# Defines the core behavior of this SPIRE Server instance.
server {

    # Listen on every network interface so the SPIRE Agent container can reach the server.
    bind_address = "0.0.0.0"

    # SPIRE Agents connect to the SPIRE Server over this TCP port.
    bind_port = "8081"

    # Local Unix domain socket used by administrative SPIRE Server CLI commands.
    socket_path = "/tmp/spire-server/private/api.sock"

    # Establishes the trust domain that will appear in every SPIFFE ID issued by this server.
    trust_domain = "demo.local"

    # Directory where the SPIRE Server stores runtime data inside the container.
    data_dir = "/opt/spire/data/server"

    # Enables verbose logging so we can observe SPIRE's behavior while learning.
    log_level = "DEBUG"
}

# Configures the plugins SPIRE uses for storage, node attestation, and key management.
plugins {

    # Provides persistent storage for SPIRE state such as registration entries.
    DataStore "sql" {

        # Configuration passed specifically to the built-in SQL datastore plugin.
        plugin_data {

            # Uses SQLite because this is a small local learning environment.
            database_type = "sqlite3"

            # Stores the SQLite database inside the SPIRE Server's persistent data directory.
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    # Allows SPIRE Agents to perform node attestation using a one-time join token.
    NodeAttestor "join_token" {

        # The join-token attestor requires no additional plugin-specific configuration here.
        plugin_data {}
    }

    # Stores the SPIRE Server's cryptographic signing keys on disk.
    KeyManager "disk" {

        # Configuration passed specifically to the disk-based key manager.
        plugin_data {

            # Stores the server's signing keys inside its persistent data directory.
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}