# Defines the core behavior of this SPIRE Agent instance.
agent {

    # Places this Agent in the same SPIFFE trust domain as the SPIRE Server.
    trust_domain = "demo.local"

    # Uses Docker DNS to locate the SPIRE Server container by its service name.
    server_address = "spire-server"

    # Connects to the SPIRE Server on its Agent-facing TCP port.
    server_port = "8081"

    # Stores temporary SPIRE Agent runtime state inside the container.
    data_dir = "/opt/spire/data/agent"

    # Exposes the SPIFFE Workload API through this local Unix domain socket.
    socket_path = "/tmp/spire-agent/public/api.sock"

    # Enables verbose logs so we can observe attestation and identity operations.
    log_level = "DEBUG"

    # Skips server identity verification during initial bootstrap for this local lab only.
    insecure_bootstrap = true
}

# Configures plugins used by the SPIRE Agent.
plugins {

    # Presents a one-time Server-generated token to perform node attestation.
    NodeAttestor "join_token" {

        # This NodeAttestor requires no additional plugin-specific configuration here.
        plugin_data {}
    }

    # Stores the SPIRE Agent's private key in memory rather than persistent storage.
    KeyManager "memory" {

        # The memory KeyManager requires no additional plugin-specific configuration.
        plugin_data {}
    }

    # Determines workload properties from the Unix process requesting an identity.
    WorkloadAttestor "unix" {

        # The Unix workload attestor requires no additional configuration for this lab.
        plugin_data {}
    }

    # Generates workload selectors from Docker container properties such as labels.
    WorkloadAttestor "docker" {

        # Uses the default Docker daemon socket and automatic Docker API negotiation.
        plugin_data {}
    }
}